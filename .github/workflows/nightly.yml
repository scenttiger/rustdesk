name: nightly

on:
  schedule:
    # 03:00 UTC = 06:00 MSK. Ежедневная ночная сборка.
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  windows:
    name: Build Windows x64
    uses: ./.github/workflows/build-windows.yml
    secrets: inherit

  linux:
    name: Build Linux x86_64
    uses: ./.github/workflows/build-linux.yml
    secrets: inherit